# Configuration for the Automated Security Helper (ASH) v3: https://github.com/awslabs/automated-security-helper
#   uvx git+https://github.com/awslabs/automated-security-helper.git@v3.7.1 --mode local
project_name: sample-ai-chat-for-amazon-bedrock-wordpress
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: vendor/**
      reason: Composer development dependencies installed locally; not part of the repository.
    - path: ai-chat-for-amazon-bedrock/vendor/**
      reason: Runtime dependencies installed by Composer from the committed lock file; scanned via the lock file (grype/syft).
    - path: tests/e2e/node_modules/**
      reason: npm development dependency installed locally; not part of the repository.
    - path: dist/**
      reason: Build output of bin/build.sh; not part of the repository.
